name: Publish PatchLoom release
on:
  push:
    branches: [main]
    paths: [patchloom.zip, .github/workflows/release.yml]
  workflow_dispatch:
permissions:
  contents: write
  statuses: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate package and release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version=$(sed -n 's/^ \* Version: //p' patchloom/patchloom.php)
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          unzip -tq patchloom.zip
          unzip -q patchloom.zip -d "$RUNNER_TEMP/packed"
          diff -qr patchloom "$RUNNER_TEMP/packed/patchloom"
          find patchloom -name '*.php' -exec php -l {} \; | tee "$RUNNER_TEMP/lint"
          ! grep -q 'Errors parsing' "$RUNNER_TEMP/lint"
          php tests/clarification.php
          tag="v$version"
          published=false
          for attempt in 1 2 3; do
            if gh release view "$tag" >/dev/null 2>&1; then
              if [[ "$(gh release view "$tag" --json targetCommitish --jq .targetCommitish)" != "$GITHUB_SHA" ]]; then
                target=$(gh release view "$tag" --json targetCommitish --jq .targetCommitish)
                expected=$(git hash-object patchloom.zip)
                actual=$(gh api "repos/$GITHUB_REPOSITORY/contents/patchloom.zip?ref=$target" --jq .sha)
                [[ "$expected" == "$actual" ]] || exit 1
              fi
              if [[ "$(gh release view "$tag" --json isDraft --jq .isDraft)" == true ]]; then
                if gh release upload "$tag" patchloom.zip --clobber && gh release edit "$tag" --draft=false; then published=true; break; fi
              else
                published=true; break
              fi
            elif gh release create "$tag" patchloom.zip --target "$GITHUB_SHA" --title "PatchLoom $tag" --notes "Installable WordPress plugin."; then
              published=true; break
            fi
            sleep 5
          done
          [[ "$published" == true ]]
          gh release download "v$version" -p patchloom.zip -D "$RUNNER_TEMP/verify"
          cmp patchloom.zip "$RUNNER_TEMP/verify/patchloom.zip"
          gh api "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" -f state=success -f context=patchloom/release -f description='Release ZIP downloaded and verified'
